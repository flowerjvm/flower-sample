server:
  port: 8083

spring:
  datasource:
    url: jdbc:sqlite:./build/durable-order-data.db?busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  sql:
    init:
      mode: always

flower:
  enabled: true
  auto-start: true
  persistence:
    type: jdbc
    jdbc:
      dialect: sqlite
  workers:
    - name: orders
      interval-ms: 250

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
